# Scaffold for a future SonarQube/SonarCloud CI step (e.g. `sonar-scanner` or the
# sonarsource/sonarqube-scan-action GitHub Action). No server is run from this file directly —
# local static analysis of the same Sonar rule set already runs via `npm run lint`
# (eslint-plugin-sonarjs, see .eslintrc.cjs).

sonar.projectKey=pctk__default
sonar.projectName=Pctk Default MCP Server
sonar.projectVersion=1.0.0

sonar.sources=src,bin
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.exclusions=test/fixtures/module-report/**,node_modules/**,dist/**,coverage/**

sonar.sourceEncoding=UTF-8

# Produced by `npm run test:coverage` (vitest --coverage, v8 provider, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
